
<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kontak Liquid Foom</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/form.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#konten">
    Lewati ke konten utama
  </a>

  <header class="site-header">
    <nav class="nav" aria-label="Navigasi utama">
      <a class="brand" href="index.html">Liquid Foom</a>
      <ul>
        <li><a href="index.html">Beranda</a></li>
        <li><a href="tentang.html">Tentang Kami</a></li>
        <li><a href="produk.html">Produk</a></li>
        <li><a href="galeri.html">Galeri</a></li>
        <li><a href="kontak.html" aria-current="page">Kontak</a></li>
      </ul>
    </nav>
  </header>

  <main id="konten" class="page">
    <h1>Kontak Liquid Foom</h1>
    <p>
      Punya pertanyaan tentang produk Liquid Foom?
      Silakan isi formulir berikut.
    </p>

    <form id="form-kontak" action="#" method="post">
      <div class="field">
        <label for="nama">Nama lengkap</label>
        <input
          id="nama"
          name="nama"
          type="text"
          autocomplete="name"
          required
          minlength="3"
        >
      </div>

      <div class="field">
        <label for="email">Email</label>
        <input
          id="email"
          name="email"
          type="email"
          autocomplete="email"
          required
        >
      </div>

      <div class="field">
        <label for="paket">Produk yang diminati</label>
        <select id="paket" name="paket" required>
          <option value="">Pilih produk</option>
          <option value="ice-strawberry">Liquid Foom Ice Strawberry</option>
          <option value="ice-mango">Liquid Foom Ice Mango</option>
          <option value="ice-lychee">Liquid Foom Ice Lychee</option>
        </select>
      </div>

      <fieldset>
        <legend>Topik pertanyaan</legend>

        <label>
          <input type="radio" name="topik"
                 value="informasi-produk" required>
          Informasi produk
        </label>

        <label>
          <input type="radio" name="topik" value="harga">
          Informasi harga
        </label>

        <label>
          <input type="radio" name="topik" value="lainnya">
          Pertanyaan lainnya
        </label>
      </fieldset>

      <div class="field">
        <label for="pesan">Pesan</label>
        <textarea
          id="pesan"
          name="pesan"
          rows="5"
          required
          minlength="10"
        ></textarea>
      </div>

      <button type="submit">Tampilkan Preview</button>
    </form>

    <section aria-labelledby="preview-title">
      <h2 id="preview-title">Preview Data</h2>
      <pre id="preview-form" aria-live="polite">Data form akan muncul setelah dikirim.</pre>
    </section>
  </main>

  <footer class="site-footer">
    <p>&copy; 2026 Liquid Foom.</p>
  </footer>
</body>
</html>
